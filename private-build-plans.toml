[buildPlans.Iosevka]
family = "Iosevka"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
# no ligature
noLigation = true


[buildPlans.Iosevka.variants.design]
number-sign = "slanted"
one = "base"
two = "straight-neck-serifless"
eight = "two-circles"
zero = "oval-slashed"
capital-m = "slanted-sides-hanging-serifless"
capital-q = "detached-tailed"
f = "flat-hook-serifless-crossbar-at-x-height"
j = "flat-hook-serifed"
t = "flat-hook-short-neck"
lig-ltgteq = "slanted"

[buildPlans.Iosevka.variants.italic]
number-sign = "slanted"
one = "base"
two = "straight-neck-serifless"
eight = "two-circles"
zero = "oval-slashed"
capital-m = "slanted-sides-hanging-serifless"
capital-q = "detached-tailed"
f = "flat-hook-tailed-crossbar-at-x-height"
j = "flat-hook-serifed"
t = "flat-hook-short-neck"
lig-ltgteq = "slanted"

[buildPlans.Iosevka.ligations]
inherits = "javascript"

[buildPlans.Iosevka.weights.Regular]
# shape: use 350 weight as regular
shape = 400
menu = 400
css = 400

[buildPlans.Iosevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Iosevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Iosevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# [buildPlans.Iosevka.widths.SemiExtended]
# shape = 548
# menu = 6
# css = "semi-expanded"

[buildPlans.Iosevka.widths.Normal]
shape = 500
menu = 5
css = "normal"